name: q2354-windows-repro

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow mode
        required: true
        default: reference
        type: choice
        options:
          - reference
          - verify
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Record Windows host
        shell: pwsh
        run: |
          $hostInfo = [ordered]@{
            caption = (Get-CimInstance Win32_OperatingSystem).Caption
            version = (Get-CimInstance Win32_OperatingSystem).Version
            build = (Get-CimInstance Win32_OperatingSystem).BuildNumber
            runner_image = $env:ImageOS
            node_version = (node --version)
            commit_sha = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
          }
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $hostInfo | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/windows-host.json
          helm version --short | Set-Content -Encoding utf8NoBOM evidence/helm-version.txt
      - name: Generate Reference candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reference' }}
        shell: pwsh
        run: python ./qa/generate_reference.py
      - name: Verify final attachments
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify') }}
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python).Source
          $helmPath = (Get-Command helm).Source
          New-NetFirewallRule -DisplayName q2354-python-no-external -Direction Outbound -Program $pythonPath -Action Block | Out-Null
          New-NetFirewallRule -DisplayName q2354-helm-no-external -Direction Outbound -Program $helmPath -Action Block | Out-Null
          Get-NetFirewallRule -DisplayName q2354-*-no-external | Select-Object DisplayName, Enabled, Direction, Action | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/network-guard.json
          python ./qa/windows_verify.py
      - name: Remove process network guard
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName q2354-*-no-external -ErrorAction SilentlyContinue | Remove-NetFirewallRule
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2354-windows-evidence
          path: evidence/**
          if-no-files-found: error
          retention-days: 1
